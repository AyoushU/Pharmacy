
name: MedicalShop CI-CD

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

jobs:
  build:
    name: Build MedicalShop
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore NuGet packages
        run: dotnet restore MedicalShop.slnx

      - name: Build solution
        run: dotnet build MedicalShop.slnx --configuration Release --no-restore

      - name: Publish Web Application
        run: dotnet publish MedicalShop.Web/MedicalShop.Web.csproj --configuration Release --no-build --output ./publish

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MedicalShop-Build
          path: ./publish

  deploy:
    name: Deploy to IIS
    needs: build
    if: github.event_name == 'push'
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: MedicalShop-Build
          path: ${{ runner.temp }}\MedicalShop-Build

     - name: Deploy to IIS
      shell: powershell
        run: |
            Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force

            $source = Join-Path $env:RUNNER_TEMP "MedicalShop-Build"
            $destination = "C:\inetpub\MedicalShop"
             $offline = Join-Path $destination "app_offline.htm"

             New-Item -ItemType File -Path $offline -Force | Out-Null

             try {
           robocopy $source $destination /E /R:3 /W:5 /XF appsettings.json appsettings.*.json

           $copyExitCode = $LASTEXITCODE

           if ($copyExitCode -ge 8) {
             throw "Deployment failed. Robocopy exit code: $copyExitCode"
                }
             }
            finally {
        Remove-Item $offline -Force -ErrorAction SilentlyContinue
         }

        $global:LASTEXITCODE = 0
        Write-Host "MedicalShop deployment completed."
